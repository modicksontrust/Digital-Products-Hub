openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DigiProducts API — single-tenant AI digital product creation platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: learn
  - name: dashboard
  - name: products
  - name: generation
  - name: exportsTag
  - name: reviews
  - name: notifications
  - name: assets
  - name: credits
  - name: admin
  - name: public
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---------- Auth ----------
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current session user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
  /auth/invites/{token}:
    get:
      operationId: getInvite
      tags: [auth]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invite details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
  /auth/invites/{token}/accept:
    post:
      operationId: acceptInvite
      tags: [auth]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteAccept"
      responses:
        "200":
          description: Account created and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset link issued (always ok)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetIssued"
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /auth/account:
    patch:
      operationId: updateAccount
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"

  # ---------- Public ----------
  /access-requests:
    post:
      operationId: createAccessRequest
      tags: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  # ---------- Learn ----------
  /learn/modules:
    get:
      operationId: getLearnModules
      tags: [learn]
      responses:
        "200":
          description: Modules with lessons and my progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearnModule"
  /learn/lessons/{lessonId}:
    get:
      operationId: getLesson
      tags: [learn]
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lesson detail with progress and next lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonDetail"
  /learn/lessons/{lessonId}/progress:
    post:
      operationId: postLessonProgress
      tags: [learn]
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonProgressInput"
      responses:
        "200":
          description: Progress saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonProgress"
  /learn/lessons/{lessonId}/complete:
    post:
      operationId: completeLesson
      tags: [learn]
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lesson completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnStatus"
  /learn/status:
    get:
      operationId: getLearnStatus
      tags: [learn]
      responses:
        "200":
          description: Onboarding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnStatus"

  # ---------- Dashboard ----------
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      responses:
        "200":
          description: Role-scoped stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      responses:
        "200":
          description: Recent activity events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"

  # ---------- Credits ----------
  /credits/transactions:
    get:
      operationId: getCreditTransactions
      tags: [credits]
      responses:
        "200":
          description: My credit ledger
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditTransaction"
  /credits/request:
    post:
      operationId: requestCredits
      tags: [credits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditRequestInput"
      responses:
        "200":
          description: Request sent to admins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  # ---------- Products ----------
  /products:
    get:
      operationId: getProducts
      tags: [products]
      parameters:
        - name: type
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: ownerId
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Product list (role scoped)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{productId}:
    get:
      operationId: getProduct
      tags: [products]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product detail with chapters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
    patch:
      operationId: updateProduct
      tags: [products]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{productId}/duplicate:
    post:
      operationId: duplicateProduct
      tags: [products]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: New draft clone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{productId}/archive:
    post:
      operationId: archiveProduct
      tags: [products]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{productId}/submit-review:
    post:
      operationId: submitForReview
      tags: [products]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{productId}/review:
    post:
      operationId: reviewProduct
      tags: [reviews]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecision"
      responses:
        "200":
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{productId}/chapters:
    post:
      operationId: addChapter
      tags: [products]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterInput"
      responses:
        "201":
          description: Chapter added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
  /products/{productId}/chapters/{chapterId}:
    patch:
      operationId: updateChapter
      tags: [products]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
        - name: chapterId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
    delete:
      operationId: deleteChapter
      tags: [products]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
        - name: chapterId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /products/{productId}/chapters-reorder:
    post:
      operationId: reorderChapters
      tags: [products]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterReorder"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /products/{productId}/comments:
    get:
      operationId: getComments
      tags: [reviews]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: addComment
      tags: [reviews]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
  /products/{productId}/sales-copy:
    get:
      operationId: getSalesCopy
      tags: [products]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sales copy draft (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesCopy"
    patch:
      operationId: updateSalesCopy
      tags: [products]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesCopyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesCopy"
  /reviews/queue:
    get:
      operationId: getReviewQueue
      tags: [reviews]
      responses:
        "200":
          description: Products awaiting review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  # ---------- Generation ----------
  /generate/outline:
    post:
      operationId: generateOutline
      tags: [generation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutlineGenInput"
      responses:
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
  /generate/chapters:
    post:
      operationId: generateChapters
      tags: [generation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChaptersGenInput"
      responses:
        "202":
          description: Batch queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
  /generate/chapters/{chapterId}/rewrite:
    post:
      operationId: rewriteChapter
      tags: [generation]
      parameters:
        - name: chapterId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewriteInput"
      responses:
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
  /generate/sales-copy:
    post:
      operationId: generateSalesCopy
      tags: [generation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesCopyGenInput"
      responses:
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
  /generate/lead-magnet:
    post:
      operationId: generateLeadMagnet
      tags: [generation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadMagnetGenInput"
      responses:
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [generation]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job status with per-chapter progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"

  # ---------- Exports ----------
  /products/{productId}/export:
    post:
      operationId: exportProduct
      tags: [exportsTag]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportInput"
      responses:
        "201":
          description: Export created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportRecord"
  /products/{productId}/exports:
    get:
      operationId: getProductExports
      tags: [exportsTag]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Export versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExportRecord"

  # ---------- Notifications ----------
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      responses:
        "200":
          description: My notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppNotification"
  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      responses:
        "200":
          description: All marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  # ---------- Brand kit ----------
  /brand-kit:
    get:
      operationId: getBrandKit
      tags: [admin]
      responses:
        "200":
          description: Org brand kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandKit"

  # ---------- Admin ----------
  /admin/users:
    get:
      operationId: getUsers
      tags: [admin]
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /admin/users/{userId}:
    patch:
      operationId: updateUser
      tags: [admin]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /admin/users/{userId}/credits:
    post:
      operationId: grantCredits
      tags: [admin]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditGrant"
      responses:
        "200":
          description: Granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /admin/invitations:
    get:
      operationId: getInvitations
      tags: [admin]
      responses:
        "200":
          description: All invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
    post:
      operationId: createInvitation
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Invitation created (includes accept URL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
  /admin/invitations/{invitationId}/revoke:
    post:
      operationId: revokeInvitation
      tags: [admin]
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /admin/access-requests:
    get:
      operationId: getAccessRequests
      tags: [admin]
      responses:
        "200":
          description: Access requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessRequest"
  /admin/access-requests/{requestId}:
    patch:
      operationId: updateAccessRequest
      tags: [admin]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRequestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequest"
  /admin/modules:
    post:
      operationId: createModule
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnModule"
  /admin/modules/{moduleId}:
    patch:
      operationId: updateModule
      tags: [admin]
      parameters:
        - name: moduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnModule"
    delete:
      operationId: deleteModule
      tags: [admin]
      parameters:
        - name: moduleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /admin/lessons:
    post:
      operationId: createLesson
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
  /admin/lessons/{lessonId}:
    patch:
      operationId: updateLesson
      tags: [admin]
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
    delete:
      operationId: deleteLesson
      tags: [admin]
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
